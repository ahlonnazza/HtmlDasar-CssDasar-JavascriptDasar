<!DOCTYPE html>
<html>
<head>
    <title>Belajar Javascript</title>
    <script src="main.js"></script>
    <style>
        #wrap {
            background: black;
            color: white;
            font-size: 25px;
        }
    </style>
</head>
<body>

    <img src="2820.jpg" alt="">
    <div id="wrap"></div>

    <script>
        //Deklarasi variable
        // Nama dimulai dengan huruf atau $ atau _
        // Nama boleh mengandung huruf, angka, underscore _ dan $ dollar
        // Nama itu case sensitive
        // Ada 'reserved words' yang tidak boleh dipakai
    
        //tipe data string
        var text = "ini string 7363527272828";
    
        /*
         1. memilih id wrap
         2.metode innerHTML = nulis konten
        */
        document.getElementById("wrap").innerHTML = text;
    </script>
</body>
</html>
